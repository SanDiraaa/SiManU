<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <!-- Mobile-first viewport with viewport-fit=cover and disabled accidental zoom -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  
  <title>PocketLedger</title>
  
  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PocketLedger" />
  <meta name="description" content="Aplikasi keuangan personal dan split bill mobile-first offline PWA." />
  
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />

  <!-- 1. Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfdf5',
              100: '#d1fae5',
              500: '#10b981',
              600: '#059669',
              700: '#047857'
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- 2. Dexie.js (Offline Local with CDN Fallback) -->
  <script src="./js/vendor/dexie.min.js"></script>
  <script>
    if (typeof Dexie === 'undefined') {
      document.write('<script src="https://cdn.jsdelivr.net/npm/dexie@3.2.4/dist/dexie.min.js"><\/script>');
    }
  </script>

  <!-- 3. Lucide Icons (Offline Local with CDN Fallback) -->
  <script src="./js/vendor/lucide.min.js"></script>
  <script>
    if (typeof lucide === 'undefined') {
      document.write('<script src="https://unpkg.com/lucide@latest"><\/script>');
    }
  </script>

  <!-- 4. FontAwesome CDN (Sebagai opsi pelengkap) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <style>
    /* Mobile-optimized touch behaviour, pull-to-refresh prevention and safe areas */
    html, body {
      overscroll-behavior-y: contain;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
      --sar: env(safe-area-inset-right, 0px);
    }
    #app-container, main {
      overscroll-behavior-y: contain;
    }
    #app-container {
      padding-left: env(safe-area-inset-left, 0px);
      padding-right: env(safe-area-inset-right, 0px);
    }
    .safe-padding-top {
      padding-top: calc(0.75rem + env(safe-area-inset-top, 0px));
    }
    .safe-padding-bottom {
      padding-bottom: calc(0.75rem + env(safe-area-inset-bottom, 0px));
    }
    /* Custom sleek mobile scrollbar */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 9999px;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.18s ease-out forwards;
    }
  </style>
</head>
<body class="bg-slate-950 font-sans antialiased text-slate-100 flex justify-center">

  <!-- Mobile-First App Shell Container -->
  <div id="app-container" class="w-full max-w-md mx-auto min-h-screen bg-slate-900 text-slate-100 flex flex-col justify-between shadow-2xl relative border-x border-slate-800/60 overflow-hidden">
    
    <!-- Top Mobile App Bar (Header) -->
    <header class="sticky top-0 z-30 bg-slate-900/90 backdrop-blur-md border-b border-slate-800/80 px-4 py-3 safe-padding-top flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-500 flex items-center justify-center text-white shadow-md shadow-emerald-950/40">
          <i data-lucide="wallet" class="w-4 h-4 stroke-[2.2]"></i>
        </div>
        <div>
          <h1 class="text-sm font-bold tracking-tight text-white flex items-center gap-1.5">
            PocketLedger
            <span class="text-[9px] px-1.5 py-0.2 rounded font-mono font-medium bg-emerald-500/20 text-emerald-400">PWA</span>
          </h1>
          <p class="text-[10px] text-slate-400">Personal & Split Bill Offline</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <div class="text-right">
          <div class="text-[10px] text-slate-400 font-medium leading-none">Total Saldo</div>
          <div id="header-total-balance" class="text-xs font-bold font-mono text-emerald-400 mt-0.5">Rp 0</div>
        </div>
      </div>
    </header>

    <!-- Main Content Area (Dynamic Placeholder) -->
    <main id="app-content" class="flex-1 overflow-y-auto px-4 py-4 space-y-4">
      <!-- Content dynamically injected by js/app.js -->
      <div class="flex flex-col items-center justify-center h-64 text-slate-500">
        <i data-lucide="loader-2" class="w-8 h-8 animate-spin mb-2 text-emerald-500"></i>
        <p class="text-xs">Memuat PocketLedger...</p>
      </div>
    </main>

    <!-- Responsive Mobile Bottom Navigation Bar -->
    <nav class="sticky bottom-0 z-30 bg-slate-900/95 backdrop-blur-lg border-t border-slate-800 px-2 safe-padding-bottom">
      <div class="grid grid-cols-4 items-center">
        
        <!-- Tab 1: Transaksi -->
        <button id="tab-transaksi" type="button" class="tab-btn flex flex-col items-center justify-center py-2 px-3 text-emerald-400 font-medium transition-colors relative">
          <i data-lucide="arrow-left-right" class="tab-icon w-5 h-5 mb-1 stroke-[2.5]"></i>
          <span class="tab-label text-xs font-semibold">Transaksi</span>
        </button>

        <!-- Tab 2: Split Bill -->
        <button id="tab-splitbill" type="button" class="tab-btn flex flex-col items-center justify-center py-2 px-3 text-slate-400 hover:text-slate-200 transition-colors relative">
          <i data-lucide="users" class="tab-icon w-5 h-5 mb-1 stroke-[1.8]"></i>
          <span class="tab-label text-xs">Split Bill</span>
        </button>

        <!-- Tab 3: Analisis -->
        <button id="tab-analisis" type="button" class="tab-btn flex flex-col items-center justify-center py-2 px-3 text-slate-400 hover:text-slate-200 transition-colors relative">
          <i data-lucide="pie-chart" class="tab-icon w-5 h-5 mb-1 stroke-[1.8]"></i>
          <span class="tab-label text-xs">Analisis</span>
        </button>

        <!-- Tab 4: Pengaturan -->
        <button id="tab-pengaturan" type="button" class="tab-btn flex flex-col items-center justify-center py-2 px-3 text-slate-400 hover:text-slate-200 transition-colors relative">
          <i data-lucide="settings" class="tab-icon w-5 h-5 mb-1 stroke-[1.8]"></i>
          <span class="tab-label text-xs">Pengaturan</span>
        </button>

      </div>
    </nav>

  </div>

  <!-- Universal Bundled Application Script -->
  <!-- Kompatibel penuh: file:/// (double click), localhost, PWA offline, dan Android Capacitor -->
  <script src="./js/app.bundle.js?v=2.2.0"></script>

  <script>
    // Watchdog Loading Timer: Jika setelah 3.5 detik konten belum termuat, berikan instruksi ramah
    setTimeout(function() {
      const content = document.getElementById('app-content');
      if (content && content.innerHTML.includes('Memuat PocketLedger...')) {
        const isFileProtocol = window.location.protocol === 'file:';
        content.innerHTML = `
          <div class="flex flex-col items-center justify-center min-h-[300px] text-center p-6 bg-slate-800/40 rounded-3xl border border-slate-800 text-slate-300 space-y-4 animate-fade-in">
            <div class="w-14 h-14 rounded-2xl bg-amber-500/15 text-amber-400 flex items-center justify-center border border-amber-500/30">
              <i data-lucide="alert-triangle" class="w-7 h-7"></i>
            </div>
            <div>
              <h3 class="text-sm font-bold text-white mb-1.5">Membutuhkan Akses Local Server</h3>
              <p class="text-xs text-slate-400 leading-relaxed max-w-xs">
                ${isFileProtocol 
                  ? 'Browser membatasi beberapa modul & penyimpanan IndexedDB jika dibuka langsung lewat protokol <code>file:///</code>. Disarankan jalankan server lokal: <code>python -m http.server 8000</code> atau ekstensi Live Server.' 
                  : 'Database IndexedDB belum siap atau dibatasi oleh pengaturan mode privasi browser Anda.'}
              </p>
            </div>
            <button onclick="window.location.reload()" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-xl shadow-lg shadow-emerald-950/40 transition-all active:scale-95 flex items-center gap-2">
              <i data-lucide="refresh-cw" class="w-4 h-4"></i>
              Muat Ulang Halaman
            </button>
          </div>
        `;
        if (window.lucide && typeof window.lucide.createIcons === 'function') {
          window.lucide.createIcons();
        }
      }
    }, 3500);

    // Inisialisasi ikon Lucide fallback
    if (window.lucide && typeof window.lucide.createIcons === 'function') {
      window.lucide.createIcons();
    }
  </script>
</body>
</html>
